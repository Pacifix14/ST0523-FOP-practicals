name: Test All Questions (Simple)

on:
  push:
    branches: [ main, master, feat/*, dev, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-all-questions:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Setup Test Environment
      run: |
        echo "📦 Setting up test environment..."
        cp package.json package.json.backup
        echo '{"studentId": "p0000000", "className": "DIT/FT/1A/01"}' > package.json
    - name: Test Problem Set p3 (Functions)
      timeout-minutes: 5
      run: timeout 300s node run.js p3 || echo "⚠️ Test timed out"
      continue-on-error: true
      
    - name: Test Problem Set p4 (Selections)
      timeout-minutes: 5
      run: timeout 300s node run.js p4 || echo "⚠️ Test timed out"
      continue-on-error: true
      
    - name: Test Problem Set p5 (Loops)
      timeout-minutes: 5
      run: timeout 300s node run.js p5 || echo "⚠️ Test timed out"
      continue-on-error: true
      
    - name: Test Problem Set p6 (Arrays)
      timeout-minutes: 5
      run: timeout 300s node run.js p6 || echo "⚠️ Test timed out"
      continue-on-error: true
      
    - name: Test Problem Set p7 (While)
      timeout-minutes: 2
      run: |
        echo "🔍 Testing Problem Set 7 (While & Nested loops)..."
        echo "⚠️ Note: Using 2-minute timeout to prevent infinite loops"
        echo "If this times out, check your while loop conditions!"
        timeout 120s node run.js p7 && echo "✅ p7 tests completed successfully!" || echo "⚠️ p7 tests timed out after 2 minutes - likely infinite loop in while questions"
      continue-on-error: true
      
    - name: Test Problem Set p8 (Objects)
      timeout-minutes: 5
      run: timeout 300s node run.js p8 || echo "⚠️ Test timed out"
      continue-on-error: true
      
    - name: Test Problem Set p9 (Problem Solving)
      timeout-minutes: 5
      run: timeout 300s node run.js p9 || echo "⚠️ Test timed out"
      continue-on-error: true
      
    - name: Restore Original Package
      if: always()
      run: |
        echo "🔄 Restoring original package.json..."
        mv package.json.backup package.json
      
    - name: Test Summary
      if: always()
      run: |
        echo "📊 Test Results Summary"
        echo "========================"
        echo "All problem sets (p3-p9) have been tested."
        echo ""
        echo "📝 Important Notes:"
        echo "• p7 (While loops) has a 2-minute timeout to prevent infinite loops"
        echo "• If p7 times out, check your while loop conditions (infinite loops)"
        echo "• Tests continue even if some fail to show complete results"
        echo "• Original package.json has been restored"
        echo ""
        echo "Check individual step results above for detailed pass/fail status." 