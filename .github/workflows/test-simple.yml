name: Test All Questions (Simple)

on:
  push:
    branches: [ main, master, feat/*, dev, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-all-questions:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Setup Test Environment
      run: |
        echo "📦 Setting up test environment..."
        cp package.json package.json.backup
        echo '{"studentId": "p0000000", "className": "DIT/FT/1A/01"}' > package.json
        
    - name: Test Problem Set p3 (Functions)
      timeout-minutes: 5
      run: timeout 300s node run.js p3 || echo "⚠️ Test timed out"
      continue-on-error: true
      
    - name: Test Problem Set p4 (Selections)
      timeout-minutes: 5
      run: timeout 300s node run.js p4 || echo "⚠️ Test timed out"
      continue-on-error: true
      
    - name: Test Problem Set p5 (Loops)
      timeout-minutes: 5
      run: timeout 300s node run.js p5 || echo "⚠️ Test timed out"
      continue-on-error: true
      
    - name: Test Problem Set p6 (Arrays)
      timeout-minutes: 5
      run: timeout 300s node run.js p6 || echo "⚠️ Test timed out"
      continue-on-error: true
      
    - name: Test Problem Set p7 (While)
      timeout-minutes: 3
      run: |
        echo "⚠️ Note: p7 has shorter timeout due to potential infinite loops"
        timeout 180s node run.js p7 || echo "⚠️ Test timed out (likely infinite loop)"
      continue-on-error: true
      
    - name: Test Problem Set p8 (Objects)
      timeout-minutes: 5
      run: timeout 300s node run.js p8 || echo "⚠️ Test timed out"
      continue-on-error: true
      
    - name: Test Problem Set p9 (Problem Solving)
      timeout-minutes: 5
      run: timeout 300s node run.js p9 || echo "⚠️ Test timed out"
      continue-on-error: true
      
    - name: Restore Original Package
      if: always()
      run: |
        echo "🔄 Restoring original package.json..."
        mv package.json.backup package.json
      
    - name: Test Summary
      if: always()
      run: |
        echo "All problem sets (p3-p9) have been tested."
        echo "Check individual step results above for details."
        echo "Note: Tests continue even if some fail to show all results." 