name: Test All Questions

on:
  push:
    branches: [ main, master, feat/*, dev, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-all-questions:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        problem-set: [3, 4, 5, 6, 7, 8, 9]
      fail-fast: false
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: |
        if [ -f package-lock.json ]; then
          npm ci
        else
          npm install
        fi
      
    - name: Run Problem Set p${{ matrix.problem-set }}
      run: node run.js p${{ matrix.problem-set }}
      
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-p${{ matrix.problem-set }}
        path: |
          **/*.log
          **/test-results.*
        retention-days: 30

  test-summary:
    runs-on: ubuntu-latest
    needs: test-all-questions
    if: always()
    
    steps:
    - name: Download all test results
      uses: actions/download-artifact@v3
      
    - name: Test Summary
      run: |
        echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Problem Set | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-------------|--------|" >> $GITHUB_STEP_SUMMARY
        
        for i in 3 4 5 6 7 8 9; do
          if [ "${{ needs.test-all-questions.result }}" == "success" ]; then
            echo "| Problem Set p$i | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Problem Set p$i | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
        done 