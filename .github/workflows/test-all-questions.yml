name: Test All Questions

on:
  push:
    branches: [ main, master, feat/*, dev, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-all-questions:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        problem-set: [3, 4, 5, 6, 7, 8, 9]
      fail-fast: false
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Setup Test Environment
      run: |
        echo "📦 Setting up test environment..."
        cp package.json package.json.backup
        echo '{"studentId": "p0000000", "className": "DIT/FT/1A/01"}' > package.json
      
    - name: Run Problem Set p${{ matrix.problem-set }}
      timeout-minutes: 6
      run: |
        if [ "${{ matrix.problem-set }}" = "7" ]; then
          echo "🔍 Testing Problem Set 7 (While & Nested loops)..."
          echo "⚠️ Note: Using 2-minute timeout to prevent infinite loops"
          echo "If this times out, check your while loop conditions!"
          timeout 120s node run.js p${{ matrix.problem-set }} && echo "✅ p7 tests completed successfully!" || echo "⚠️ p7 tests timed out after 2 minutes - likely infinite loop in while questions"
        else
          echo "🔍 Testing Problem Set p${{ matrix.problem-set }}..."
          timeout 300s node run.js p${{ matrix.problem-set }} && echo "✅ Tests completed successfully!" || echo "⚠️ Test timed out after 5 minutes"
        fi
      
    - name: Restore Original Package
      if: always()
      run: |
        echo "🔄 Restoring original package.json..."
        mv package.json.backup package.json

  test-summary:
    runs-on: ubuntu-latest
    needs: test-all-questions
    if: always()
    
    steps:
    - name: Test Summary
      run: |
        echo "## 📊 Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "All problem sets (p3-p9) have been tested in parallel." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**📋 Problem Sets Tested:**" >> $GITHUB_STEP_SUMMARY
        echo "- p3: Functions" >> $GITHUB_STEP_SUMMARY
        echo "- p4: Selections (If-else)" >> $GITHUB_STEP_SUMMARY
        echo "- p5: For-Loops" >> $GITHUB_STEP_SUMMARY
        echo "- p6: Arrays" >> $GITHUB_STEP_SUMMARY
        echo "- p7: While & Nested loops (2-min timeout)" >> $GITHUB_STEP_SUMMARY
        echo "- p8: Objects" >> $GITHUB_STEP_SUMMARY
        echo "- p9: Problem Solving" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**📝 Important Notes:**" >> $GITHUB_STEP_SUMMARY
        echo "- Check individual job results above for pass/fail status" >> $GITHUB_STEP_SUMMARY
        echo "- p1 (Introduction) and p2 (Operators) are skipped" >> $GITHUB_STEP_SUMMARY
        echo "- p7 timeouts usually indicate infinite loops in while questions" >> $GITHUB_STEP_SUMMARY
        echo "- Console output shows detailed test case results" >> $GITHUB_STEP_SUMMARY
        echo "- Tests run against your questions folder, not solutions" >> $GITHUB_STEP_SUMMARY 