name: Comprehensive Test Suite

on:
  push:
    branches: [ main, master, feat/*, dev, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-functions:
    name: "Test p3 (Functions)"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Setup Test Environment
      run: |
        echo "📦 Setting up test environment..."
        cp package.json package.json.backup
        echo '{"studentId": "p0000000", "className": "DIT/FT/1A/01"}' > package.json
    - name: Run Functions Tests
      timeout-minutes: 5
      run: |
        echo "🔍 Testing Problem Set 3 (Functions)..."
        timeout 300s node run.js p3 || echo "⚠️ Test timed out after 5 minutes"
        echo "✅ Functions tests completed"
    - name: Restore Original Package
      if: always()
      run: |
        echo "🔄 Restoring original package.json..."
        mv package.json.backup package.json

  test-selections:
    name: "Test p4 (Selections)"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Setup Test Environment
      run: |
        echo "📦 Setting up test environment..."
        cp package.json package.json.backup
        echo '{"studentId": "p0000000", "className": "DIT/FT/1A/01"}' > package.json
    - name: Run Selections Tests
      timeout-minutes: 5
      run: |
        echo "🔍 Testing Problem Set 4 (Selections/If-else)..."
        timeout 300s node run.js p4 || echo "⚠️ Test timed out after 5 minutes"
        echo "✅ Selections tests completed"
    - name: Restore Original Package
      if: always()
      run: |
        echo "🔄 Restoring original package.json..."
        mv package.json.backup package.json

  test-loops:
    name: "Test p5 (Loops)"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Setup Test Environment
      run: |
        echo "📦 Setting up test environment..."
        cp package.json package.json.backup
        echo '{"studentId": "p0000000", "className": "DIT/FT/1A/01"}' > package.json
    - name: Run Loops Tests
      timeout-minutes: 5
      run: |
        echo "🔍 Testing Problem Set 5 (For-Loops)..."
        timeout 300s node run.js p5 || echo "⚠️ Test timed out after 5 minutes"
        echo "✅ Loops tests completed"
    - name: Restore Original Package
      if: always()
      run: |
        echo "🔄 Restoring original package.json..."
        mv package.json.backup package.json

  test-arrays:
    name: "Test p6 (Arrays)"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Setup Test Environment
      run: |
        echo "📦 Setting up test environment..."
        cp package.json package.json.backup
        echo '{"studentId": "p0000000", "className": "DIT/FT/1A/01"}' > package.json
    - name: Run Arrays Tests
      timeout-minutes: 5
      run: |
        echo "🔍 Testing Problem Set 6 (Arrays)..."
        timeout 300s node run.js p6 || echo "⚠️ Test timed out after 5 minutes"
        echo "✅ Arrays tests completed"
    - name: Restore Original Package
      if: always()
      run: |
        echo "🔄 Restoring original package.json..."
        mv package.json.backup package.json

  test-while:
    name: "Test p7 (While)"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Setup Test Environment
      run: |
        echo "📦 Setting up test environment..."
        cp package.json package.json.backup
        echo '{"studentId": "p0000000", "className": "DIT/FT/1A/01"}' > package.json
    - name: Run While Tests
      timeout-minutes: 3
      run: |
        echo "🔍 Testing Problem Set 7 (While & Nested loops)..."
        echo "⚠️ Note: This test has a shorter timeout due to potential infinite loops"
        timeout 180s node run.js p7 || echo "⚠️ Test timed out after 3 minutes (likely infinite loop in while loop questions)"
        echo "✅ While tests completed"
    - name: Restore Original Package
      if: always()
      run: |
        echo "🔄 Restoring original package.json..."
        mv package.json.backup package.json

  test-objects:
    name: "Test p8 (Objects)"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Setup Test Environment
      run: |
        echo "📦 Setting up test environment..."
        cp package.json package.json.backup
        echo '{"studentId": "p0000000", "className": "DIT/FT/1A/01"}' > package.json
    - name: Run Objects Tests
      timeout-minutes: 5
      run: |
        echo "🔍 Testing Problem Set 8 (Objects)..."
        timeout 300s node run.js p8 || echo "⚠️ Test timed out after 5 minutes"
        echo "✅ Objects tests completed"
    - name: Restore Original Package
      if: always()
      run: |
        echo "🔄 Restoring original package.json..."
        mv package.json.backup package.json

  test-problem-solving:
    name: "Test p9 (Problem Solving)"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '18'
    - name: Setup Test Environment
      run: |
        echo "📦 Setting up test environment..."
        cp package.json package.json.backup
        echo '{"studentId": "p0000000", "className": "DIT/FT/1A/01"}' > package.json
    - name: Run Problem Solving Tests
      timeout-minutes: 5
      run: |
        echo "🔍 Testing Problem Set 9 (Problem Solving)..."
        timeout 300s node run.js p9 || echo "⚠️ Test timed out after 5 minutes"
        echo "✅ Problem solving tests completed"
    - name: Restore Original Package
      if: always()
      run: |
        echo "🔄 Restoring original package.json..."
        mv package.json.backup package.json

  summary:
    name: "Test Results Summary"
    runs-on: ubuntu-latest
    needs: [test-functions, test-selections, test-loops, test-arrays, test-while, test-objects, test-problem-solving]
    if: always()
    steps:
    - name: Create Summary
      run: |
        echo "# 📊 Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Problem Set | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-------------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| p3 (Functions) | ${{ needs.test-functions.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| p4 (Selections) | ${{ needs.test-selections.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| p5 (Loops) | ${{ needs.test-loops.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| p6 (Arrays) | ${{ needs.test-arrays.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| p7 (While) | ${{ needs.test-while.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| p8 (Objects) | ${{ needs.test-objects.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "| p9 (Problem Solving) | ${{ needs.test-problem-solving.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "*Note: p1 (Introduction) and p2 (Operators) are skipped as they cannot be executed with the test runner.*" >> $GITHUB_STEP_SUMMARY 